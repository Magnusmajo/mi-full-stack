<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio de fundamentos</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <h1>Laboratorio de fundamentos</h1>
    <p>Abre DevTools y observa qué sucede con cada acción.</p>
    <section aria-labelledby="counter-heading">
      <h2 id="counter-heading">Cambiar la página</h2>
      <p>Contador: <output id="counter" aria-live="polite">0</output></p>
      <button id="increment" type="button">Sumar uno</button>
    </section>
    <section aria-labelledby="network-heading">
      <h2 id="network-heading">Consultar al servidor</h2>
      <p>Compara una respuesta correcta, un recurso inexistente y un fallo de conexión.</p>
      <div class="actions">
        <button id="load-data" type="button">Cargar datos</button>
        <button id="load-missing" type="button">Solicitar recurso inexistente</button>
      </div>
      <p id="result" role="status">Todavía no se solicitaron datos.</p>
    </section>
  </main>
</body>
</html>
